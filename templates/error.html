<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ code }} | Consistency Pulse™</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full glass-card p-8 text-center space-y-4">
    <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-indigo-600 to-emerald-400 mx-auto flex items-center justify-center">
      <i class="fa-solid fa-bolt text-white text-xl"></i>
    </div>
    <h1 class="text-4xl font-bold">{{ code }}</h1>
    <p class="text-sm text-slate-400">{{ message }}</p>
    <a href="/" class="inline-flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-bold bg-indigo-600 hover:bg-indigo-500 text-white transition">
      <i class="fa-solid fa-house"></i> Back to dashboard
    </a>
  </div>
</body>
</html>
